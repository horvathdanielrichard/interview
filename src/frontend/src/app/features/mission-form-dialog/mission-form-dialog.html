<h2 mat-dialog-title>{{ isEdit ? 'Edit Mission' : 'New Mission' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-2 min-w-[22rem]">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Duration (minutes)</mat-label>
      <input matInput type="number" formControlName="durationMinutes" />
    </mat-form-field>

    <div class="grid grid-cols-2 gap-2">
      <mat-form-field appearance="outline">
        <mat-label>Required Strength</mat-label>
        <input matInput type="number" formControlName="requiredStrength" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Required Speed</mat-label>
        <input matInput type="number" formControlName="requiredSpeed" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Required Intelligence</mat-label>
        <input matInput type="number" formControlName="requiredIntelligence" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Required Durability</mat-label>
        <input matInput type="number" formControlName="requiredDurability" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Required Energy</mat-label>
        <input matInput type="number" formControlName="requiredEnergy" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">{{ isEdit ? 'Save' : 'Create' }}</button>
  </mat-dialog-actions>
</form>
