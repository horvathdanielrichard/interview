services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Interview.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Cors__AllowedOrigins__0=http://localhost:4200
    expose:
      - "8080"
    # No volumes: the SQLite database lives entirely in memory and is
    # intentionally re-created and re-seeded from scratch on every start.

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
